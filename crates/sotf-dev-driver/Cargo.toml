[package]
name = "sotf-dev-driver"
version = "0.8.5"
authors.workspace = true
edition.workspace = true
description = "Drives sotf-gpui's dev-api over HTTP from line-based scenario scripts"
license.workspace = true
repository.workspace = true
keywords = ["audio", "testing"]
categories = ["development-tools"]

[dependencies]
rmcp = { version = "=3.6.0", default-features = false, features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server"] }
axum = "0.8"
tokio = { workspace = true, features = ["io-std"] }
anyhow = { workspace = true }
clap = { workspace = true }
hex = { workspace = true }
image = { workspace = true }
reqwest = { workspace = true, features = ["json", "blocking"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sotf-dev-api = { path = "../sotf-dev-api" }
sysinfo = "0.31.4"
thiserror = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
rmcp = { version = "=3.6.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
sotf-dev-api = { path = "../sotf-dev-api", features = ["workbench-server"] }

[[bin]]
name = "sotf-dev-driver"
path = "src/main.rs"

[[bin]]
name = "sotf-workbench-mcp"
path = "src/workbench_mcp.rs"
