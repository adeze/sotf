[runner]
app_bin = "target/debug/sotf-desktop"
artifacts_dir = "target/qa-gpui"
demo_audio_dir = "data_tests/audio"
readiness_timeout = "20s"
size = "1440x900"

[[scenario]]
name = "recording-fake-capture"
path = "crates/sotf-dev-driver/scenarios/recording_fake_capture.scn"
timeout = "60s"
tags = ["recording", "fixture", "ui"]

[scenario.fake_recording]
channels = 2
points = 48

[[scenario]]
name = "recording-high-thd-review-retake"
path = "crates/sotf-dev-driver/scenarios/recording_high_thd_review.scn"
timeout = "90s"
tags = ["recording", "quality", "retake"]

[scenario.fake_recording]
channels = 2
profile = "high-thd"

[[scenario]]
name = "recording-low-snr-review"
path = "crates/sotf-dev-driver/scenarios/recording_low_snr_review.scn"
timeout = "60s"
tags = ["recording", "quality", "noise"]

[scenario.fake_recording]
channels = 2
profile = "low-snr"

[[scenario]]
name = "recording-unknown-evidence-review"
path = "crates/sotf-dev-driver/scenarios/recording_unknown_evidence.scn"
timeout = "60s"
tags = ["recording", "quality", "evidence"]

[scenario.fake_recording]
channels = 2
profile = "unknown-evidence"

[[scenario]]
name = "recording-device-loss-retry"
path = "crates/sotf-dev-driver/scenarios/recording_cancel_retry_error.scn"
timeout = "90s"
tags = ["recording", "error", "retry"]
allowed_log_patterns = ["Recording failed: Recording error: capture device was disconnected"]

[scenario.fake_recording]
channels = 2
points = 48
fault = "device-loss"

[[scenario]]
name = "recording-active-cancel-retry"
path = "crates/sotf-dev-driver/scenarios/recording_cancel_active_retry.scn"
timeout = "90s"
tags = ["recording", "cancel", "retry"]

[scenario.fake_recording]
channels = 2
points = 48

[[scenario]]
name = "recording-clipping-review"
path = "crates/sotf-dev-driver/scenarios/recording_clipping_review.scn"
timeout = "60s"
tags = ["recording", "quality", "clipping"]

[scenario.fake_recording]
channels = 2
points = 48
profile = "clipping"

[[scenario]]
name = "recording-roomeq-handoff"
path = "crates/sotf-dev-driver/scenarios/recording_roomeq_handoff.scn"
timeout = "300s"
mock_playback = true
tags = ["recording", "roomeq", "handoff", "optimizer", "export", "apply"]

[scenario.fake_recording]
channels = 2
points = 48
profile = "high-thd"

[[scenario]]
name = "recording-io-failure-retry"
path = "crates/sotf-dev-driver/scenarios/recording_cancel_retry_error.scn"
timeout = "90s"
tags = ["recording", "error", "retry"]
allowed_log_patterns = ["Recording failed: [record_and_analyze] Failed to stop capture: Recording error: unable to write capture data"]

[scenario.fake_recording]
channels = 2
points = 48
fault = "io-failure"
