# TUI scenario suite
# Run with:
#   cargo build -p sotf-tui --features dev-api --bin sotf-tui
#   cargo run -p sotf-dev-driver -- run-suite crates/sotf-dev-driver/suites/tui.toml -v

[runner]
app_bin = "target/debug/sotf-tui"
app_args = []
readiness_timeout = "10s"

# ── Basic navigation & smoke ────────────────────────────────────────────────

[[scenario]]
name = "tui-smoke"
path = "crates/sotf-dev-driver/scenarios/tui_smoke.scn"
timeout = "30s"

[[scenario]]
name = "tui-library"
path = "crates/sotf-dev-driver/scenarios/tui_library.scn"
timeout = "10s"

[[scenario]]
name = "tui-metadata-editor"
path = "crates/sotf-dev-driver/scenarios/tui_metadata_editor.scn"
timeout = "10s"

[[scenario]]
name = "tui-queue"
path = "crates/sotf-dev-driver/scenarios/tui_queue.scn"
timeout = "10s"

[[scenario]]
name = "tui-transport"
path = "crates/sotf-dev-driver/scenarios/tui_transport.scn"
timeout = "10s"

[[scenario]]
name = "tui-search"
path = "crates/sotf-dev-driver/scenarios/tui_search.scn"
timeout = "10s"

[[scenario]]
name = "tui-level-meters"
path = "crates/sotf-dev-driver/scenarios/tui_level_meters.scn"
timeout = "10s"

[[scenario]]
name = "tui-devices"
path = "crates/sotf-dev-driver/scenarios/tui_devices.scn"
timeout = "10s"

# ── Plugins & Playlists ─────────────────────────────────────────────────────

[[scenario]]
name = "tui-plugins"
path = "crates/sotf-dev-driver/scenarios/tui_plugins.scn"
timeout = "10s"

[[scenario]]
name = "tui-plugins-interactive"
path = "crates/sotf-dev-driver/scenarios/tui_plugins_interactive.scn"
timeout = "10s"

[[scenario]]
name = "tui-playlists"
path = "crates/sotf-dev-driver/scenarios/tui_playlists.scn"
timeout = "10s"

# ── Configure sub-screens ───────────────────────────────────────────────────

[[scenario]]
name = "tui-configure"
path = "crates/sotf-dev-driver/scenarios/tui_configure.scn"
timeout = "10s"

[[scenario]]
name = "tui-configure-directories"
path = "crates/sotf-dev-driver/scenarios/tui_configure_directories.scn"
timeout = "10s"

[[scenario]]
name = "tui-configure-recording"
path = "crates/sotf-dev-driver/scenarios/tui_configure_recording.scn"
timeout = "10s"

[[scenario]]
name = "tui-configure-roomeq"
path = "crates/sotf-dev-driver/scenarios/tui_configure_roomeq.scn"
timeout = "10s"

[[scenario]]
name = "tui-configure-headphoneeq"
path = "crates/sotf-dev-driver/scenarios/tui_configure_headphoneeq.scn"
timeout = "10s"

[[scenario]]
name = "tui-configure-spinorama"
path = "crates/sotf-dev-driver/scenarios/tui_configure_spinorama.scn"
timeout = "10s"

[[scenario]]
name = "tui-configure-federation"
path = "crates/sotf-dev-driver/scenarios/tui_configure_federation.scn"
timeout = "10s"

[[scenario]]
name = "tui-configure-servers"
path = "crates/sotf-dev-driver/scenarios/tui_configure_servers.scn"
timeout = "10s"

# ── Input-driven workflows ──────────────────────────────────────────────────

[[scenario]]
name = "tui-learning-progress"
path = "crates/sotf-dev-driver/scenarios/tui_learning_progress.scn"
timeout = "45s"
mock_playback = true

[[scenario]]
name = "tui-abx-persisted-trial"
path = "crates/sotf-dev-driver/scenarios/tui_abx_persisted_trial.scn"
timeout = "90s"
seed_demo_audio = true
mock_playback = true

[[scenario]]
name = "tui-recording-quality-review"
path = "crates/sotf-dev-driver/scenarios/tui_recording_quality_review.scn"
timeout = "240s"
tags = ["recording", "quality", "hardware-free", "tui"]

[scenario.fake_recording]
channels = 2
profile = "high-thd"

[[scenario]]
name = "tui-recording-unknown-evidence"
path = "crates/sotf-dev-driver/scenarios/tui_recording_unknown_evidence.scn"
timeout = "90s"
tags = ["recording", "unknown-quality", "hardware-free", "tui"]

[scenario.fake_recording]
channels = 2
profile = "unknown-evidence"

[[scenario]]
name = "tui-roomeq-optimize-export-apply"
path = "crates/sotf-dev-driver/scenarios/tui_roomeq_optimize_export_apply.scn"
timeout = "180s"
tags = ["roomeq", "optimizer", "export", "apply", "tui"]

[scenario.room_eq]
fixture_dir = "crates/sotf-dev-driver/testkit/roomeq/stereo_reference"
dist_path = "tui-roomeq"
target = "NearField"
loss = "Flat"
processing = "Iir"
crossover = "Lr24"
max_iter = 1000
population = 10
start = false
ui_driven = true
